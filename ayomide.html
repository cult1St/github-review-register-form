<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ayomide.css">
    <title>Registration Form</title>
</head>
<body>
    <main class="form-card">
        <h1>Registration Form</h1>
        <p>Please fill in your details to get started.</p>

        <form action="#" method="post">
            <div class="form-row">
                <div class="field">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            </div>

            <div class="field">
                <label for="date-of-birth">Date of birth</label>
                <input type="date" id="date-of-birth" name="date-of-birth" required>
            </div>

            <fieldset class="field readiness">
                <legend>Are you ready to learn?</legend>
                <label class="radio-option">
                    <input type="radio" name="ready-to-learn" value="yes" required>
                    Yes
                </label>
                <label class="radio-option">
                    <input type="radio" name="ready-to-learn" value="no">
                    No
                </label>
            </fieldset>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
