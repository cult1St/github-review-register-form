<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 mx-auto shadow" style="max-width: 500px;">

            <h2 class="text-center mb-4">Registration Form</h2>

            <form id="myForm">

                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" id="firstName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" id="lastName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Are you ready to learn?</label>
                    <select id="ready" class="form-select" required>
                        <option value="">Choose an option</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit
                </button>

            </form>

            <p id="message" class="text-success text-center mt-3"></p>

        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById("myForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let firstName = document.getElementById("firstName").value;
            let lastName = document.getElementById("lastName").value;

            document.getElementById("message").textContent =
                "Registration successful! Welcome " + firstName + " " + lastName;
                alert("Registration successful! Welcome " + firstName + " " + lastName)
            this.reset();
        });
    </script>

</body>
</html>
