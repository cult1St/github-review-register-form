
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form | Jerry Forms</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h3 class="text-center text-primary mb-4">
                        Registration Form
                    </h3>

                    <form>

                        <!-- First Name -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                            <label for="firstName">First Name</label>
                        </div>

                        <!-- Last Name -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                            <label for="lastName">Last Name</label>
                        </div>

                        <!-- Email -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                            <label for="email">Email Address</label>
                        </div>

                        <!-- Phone -->
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required>
                            <label for="phone">Phone Number</label>
                        </div>

                        <!-- Date of Birth -->
                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="dob" placeholder="Date of Birth" required>
                            <label for="dob">Date of Birth</label>
                        </div>

                        <!-- Ready to Learn -->
                        <div class="mb-3">
                            <label class="form-label">Are you ready to learn?</label>

                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="yes" name="learn" value="Yes" required>
                                <label class="form-check-label" for="yes">Yes</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="no" name="learn" value="No">
                                <label class="form-check-label" for="no">No</label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">
                            Submit Registration
                        </button>

                    </form>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
