<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Akorede Form</title>
</head>
<body class="container">
    <form id="registerForm">
        <h3 class="text-center">Registeration form requirements</h3>
        <div class="row g-3 my-3">
            <div class="col">
                <label for="firstname" class="form-label">First Name</label>
                <input id="firstname" type="text" class="form-control" placeholder="First name" aria-label="First name">
            </div>
            <div class="col">
                <label for="lastname" class="form-label">Last Name</label>
                <input id="lastname" type="text" class="form-control" placeholder="Last name" aria-label="Last name">
            </div>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail4" placeholder="Email Address">
            </div>
            <div class="col-md-6">
                <label for="inputNumber4" class="form-label">Number</label>
                <input type="number" class="form-control" id="inputNumber4" placeholder="Phone Number">
            </div>
        </div>
        <div class="my-3">
            <label for="inputDate" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="inputDate">
        </div>
        <div>
            <label class="form-check-label" for="radioDefault2">
                    Are you ready to learn
            </label>
            <div class="row">
                <div class="col-3 col-lg-1">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                    <label class="form-check-label" for="radioDefault1">
                        Yes
                    </label>
                </div>
                <div class="col-3 col-lg-1">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                    <label class="form-check-label" for="radioDefault2">
                        No
                    </label>
                </div>
            </div>
        </div>
        <div class="d-grid gap-2 d-md-block my-3">
            <button class="btn btn-primary col-3" type="submit">Submit Form</button>
        </div>
    </form>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function (event) {
            event.preventDefault();
            console.log("form submit successful");
            alert("form submit successful");
        });
    </script>
    
</body>
</html>
